			shellScript = "# GoogleCast.xcframework ships no companion dSYM of its own, which App Store Connect\n# rejects on upload (\"did not include a dSYM for the GoogleCast.framework\"). The DWARF\n# debug info is still embedded in the framework's own binary though, so dsymutil can\n# extract it into the .dSYM bundle Apple expects, straight from the copy already sitting\n# in the built product by this point in the build.\nif [ \"$CONFIGURATION\" = \"Release\" ]; then\n    FRAMEWORK_BINARY=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/GoogleCast.framework/GoogleCast\"\n    OUTPUT_DSYM=\"${DWARF_DSYM_FOLDER_PATH}/GoogleCast.framework.dSYM\"\n\n    if [ -f \"$FRAMEWORK_BINARY\" ]; then\n        echo \"Generating dSYM for GoogleCast...\"\n        dsymutil \"$FRAMEWORK_BINARY\" -o \"$OUTPUT_DSYM\"\n    else\n        echo \"warning: GoogleCast framework binary not found at $FRAMEWORK_BINARY - skipping dSYM generation\"\n    fi\nfi\n";
		};
