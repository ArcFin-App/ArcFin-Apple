name: 🐛 Bug Report
about: Report something that's broken or not working as expected
labels:
  - "type: bug"
body:
  - type: markdown
    attributes:
      value: |
        **Security issue?** Don't file it here — see [SECURITY.md](../../src/branch/v0.1.0/SECURITY.md) and email instead.

  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Brief description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - iPad
        - Mac
        - Apple TV
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      placeholder: e.g. iOS 26.0
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: Arcfin Version / Build
      description: Settings → About
      placeholder: e.g. 0.1.0 (5)
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Player Engine (if playback-related)
      options:
        - N/A
        - AVFoundation (default)
        - VLC

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Logs, screenshots, Jellyfin server version — anything else relevant.
