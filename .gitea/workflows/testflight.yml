name: TestFlight

# Pushing a signed release tag, e.g. iOS-0.2.0-build-2, archives that platform and uploads it.
on:
  push:
    tags:
      - 'iOS-*-build-*'
      - 'macOS-*-build-*'
      - 'tvOS-*-build-*'

concurrency:
  group: testflight-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  upload:
    # The nightly workflow uploads and tags release builds itself; the tags it makes don't
    # start a second upload.
    if: github.actor != 'gitea-actions'
    runs-on: macos
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the tag
        run: |
          if [[ ! "$TAG" =~ ^(iOS|macOS|tvOS)-([0-9]+\.[0-9]+\.[0-9]+)-build-([0-9]+)$ ]]; then
            echo "::error::$TAG isn't <Platform>-<version>-build-<N>"
            exit 1
          fi
          echo "PLATFORM=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "VERSION=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
          echo "BUILD=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"

      - name: Tag is signed and on main
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" main
          if ! git cat-file -p "refs/tags/$TAG" | grep -q 'BEGIN PGP SIGNATURE'; then
            echo "::error::$TAG isn't an annotated, signed tag (git tag -s)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that isn't on main"
            exit 1
          fi

      - name: Version and build match the tag
        run: |
          settings=$(xcodebuild -scheme Arcfin -destination "generic/platform=$PLATFORM" -configuration Release -showBuildSettings 2>/dev/null)
          version=$(awk -F' = ' '/ MARKETING_VERSION = /{print $2; exit}' <<< "$settings")
          build=$(awk -F' = ' '/ CURRENT_PROJECT_VERSION = /{print $2; exit}' <<< "$settings")
          if [ "$version" != "$VERSION" ] || [ "$build" != "$BUILD" ]; then
            echo "::error::Project is $version ($build) but the tag says $VERSION ($BUILD)"
            exit 1
          fi
          echo "Uploading Arcfin $VERSION ($BUILD) for $PLATFORM"

      - name: App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Arcfin \
            -configuration Release \
            -destination "generic/platform=$PLATFORM" \
            -archivePath "$RUNNER_TEMP/Arcfin.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd-archive" \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive | tee "$RUNNER_TEMP/archive.log" | grep -E ' error:|\*\* ARCHIVE'

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Arcfin.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/export.log" | grep -E 'error|Upload|EXPORT'

      # The release's screenshots, which the website shows. The upload above is already done,
      # so nothing from here on can fail it. The Mac's run needs an unlocked, logged-in session,
      # so it only happens when the MAC_SCREENSHOTS repository variable is true.
      - name: Screenshots
        if: env.PLATFORM != 'macOS' || vars.MAC_SCREENSHOTS == 'true'
        continue-on-error: true
        run: .gitea/scripts/release-screenshots.sh "$PLATFORM" "$RUNNER_TEMP/screenshots-$PLATFORM.zip"

      - name: Draft release and screenshots
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          zip="$RUNNER_TEMP/screenshots-$PLATFORM.zip"
          name="screenshots-$PLATFORM.zip"
          auth="Authorization: token $TOKEN"
          # The tag lookup skips drafts, and the release is a draft until it's published.
          id=$(curl -fsS -H "$auth" "$API/releases?limit=50" | python3 -I -c '
          import json, sys
          print(next((r["id"] for r in json.load(sys.stdin) if r["tag_name"] == sys.argv[1]), ""))' "$TAG")
          if [ -z "$id" ]; then
            case "$PLATFORM" in iOS) label="iOS & iPadOS" ;; *) label="$PLATFORM" ;; esac
            id=$(curl -fsS -H "$auth" -H "Content-Type: application/json" "$API/releases" \
              -d "$(python3 -I -c 'import json, sys; print(json.dumps({"tag_name": sys.argv[1], "name": sys.argv[2], "draft": True, "prerelease": True}))' \
                "$TAG" "Arcfin $VERSION (Build $BUILD) · $label")" \
              | python3 -I -c 'import json, sys; print(json.load(sys.stdin)["id"])')
            echo "Created a draft release for $TAG"
          fi
          [ -f "$zip" ] || { echo "No screenshots to attach"; exit 0; }
          # A re-run replaces the zip rather than adding a second one.
          for old in $(curl -fsS -H "$auth" "$API/releases/$id/assets" | python3 -I -c '
          import json, sys
          print(" ".join(str(a["id"]) for a in json.load(sys.stdin) if a["name"] == sys.argv[1]))' "$name"); do
            curl -fsS -X DELETE -H "$auth" "$API/releases/$id/assets/$old"
          done
          curl -fsS -H "$auth" -F "attachment=@$zip" "$API/releases/$id/assets?name=$name" > /dev/null
          echo "Attached $name to $TAG"

      - name: Logs
        if: failure()
        run: |
          for log in "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log"; do
            [ -f "$log" ] && { echo "== $log"; tail -n 80 "$log"; }
          done
          exit 0

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
