name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs that need Xcode or Apple's SDKs (building, the String Catalog check, which reads the
# build's extracted strings, and the package tests) run on the Mac runner. The rest only need
# git and Python and run on Ubuntu, keeping the Mac free.
#
# The Mac jobs only run when a change can affect the app: a pull request or push that touches
# only docs, images, store metadata or the release workflows skips them. A skipped job counts
# as passed, so it never blocks a merge. The Ubuntu checks always run.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change the app?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            echo "No earlier commit to compare with: building."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Everything outside these builds: docs, images, store metadata, issue templates, and
          # the release-only workflows and scripts, which the build never uses.
          app=$(git diff --name-only "$range" | grep -vE \
            -e '\.md$' \
            -e '^(docs|assets|fastlane|scripts)/' \
            -e '^(LICENSE|\.gitignore)$' \
            -e '^\.gitea/(issue_template/|pull_request_template\.yml$)' \
            -e '^\.gitea/workflows/(nightly|screenshots)\.yml$' \
            -e '^\.gitea/scripts/(nightly-[a-z]+\.(sh|py)|testflight-nightly\.py|release-screenshots\.sh)$' \
            || true)
          if [ -n "$app" ]; then
            echo "Builds run; app files changed:"
            echo "$app" | head -n 20
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing here changes the app: the Mac builds and package tests are skipped."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  package-tests:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        working-directory: LocalPackages
        run: swift test --force-resolved-versions

  build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, macOS, tvOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.platform }}
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Arcfin \
            -destination "generic/platform=${{ matrix.platform }}" \
            -derivedDataPath "$RUNNER_TEMP/dd-${{ matrix.platform }}" \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/build-${{ matrix.platform }}.log" | grep -E ' error:|\*\* BUILD'
      - name: Text is in the String Catalogs (${{ matrix.platform }})
        run: python3 .gitea/scripts/check-string-catalog.py "$RUNNER_TEMP/dd-${{ matrix.platform }}" "$GITHUB_WORKSPACE"
      # Report only for now: lists Swift warnings from this repo's own files, not dependencies.
      - name: Warnings in our code (${{ matrix.platform }})
        if: always()
        run: |
          log="$RUNNER_TEMP/build-${{ matrix.platform }}.log"
          [ -f "$log" ] || exit 0
          grep -E "^$GITHUB_WORKSPACE/[^:]+:[0-9]+:[0-9]+: warning:" "$log" | sort -u > "$RUNNER_TEMP/warnings.txt" || true
          count=$(wc -l < "$RUNNER_TEMP/warnings.txt" | tr -d ' ')
          echo "$count warning(s) in our code on ${{ matrix.platform }}"
          sed "s|^$GITHUB_WORKSPACE/||" "$RUNNER_TEMP/warnings.txt"

  # TestFlight builds are Release; this catches code that only breaks with optimisation on.
  release-build:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos
    steps:
      - uses: actions/checkout@v4
      - name: Build iOS (Release)
        run: |
          set -o pipefail
          xcodebuild \
            -scheme Arcfin \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd-release" \
            -disableAutomaticPackageResolution \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            build | grep -E ' error:|\*\* BUILD'

  # Each platform folder compiles only for its platform, through per-file filters in the project,
  # and Arcfin/Shared has no #if.
  platform-folders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Platform folders build only for their platform, Shared has no #if
        run: python3 .gitea/scripts/check-platform-folders.py

  # Merge commits are skipped: Gitea makes them when a PR is merged or its branch updated.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit has a Signed-off-by line
        run: |
          base="origin/${{ github.base_ref }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for commit in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$commit" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git log -1 --format='%h %s' "$commit") has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "All commits are signed off."
          exit "$missing"

  # Commit subjects follow Conventional Commits, <type>(scope): message; the release notes are
  # sorted by type. Merge commits and git's "Revert ..." commits are skipped.
  commit-format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit subject is <type>(scope) message
        run: python3 -I .gitea/scripts/check-commits.py "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"

  # Everything Arcfin ships has its licence on the Legal & Licenses screen, at the pinned
  # version. Fetches each pinned package's source, so it fails when a dependency is added,
  # removed or bumped without running .gitea/scripts/update-licenses.py. A change on the
  # website's legal pages is only a warning.
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every bundled component has its current licence
        run: python3 .gitea/scripts/update-licenses.py --check
