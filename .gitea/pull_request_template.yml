name: Pull Request
about: Standard pull request template
body:
  - type: input
    id: issue
    attributes:
      label: Related Issue
      description: "Leave blank if there isn't one."
      placeholder: "Resolves #123"

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: "One or two sentences — what and why."
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Changes
      value: "-\n-"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Self-reviewed
          required: true
        - label: "Commits are signed off (`git commit -s`) per the DCO — see CONTRIBUTING.md"
          required: true
        - label: "Commit subjects are `<type>(scope): message` (Conventional Commits) — see CONTRIBUTING.md"
          required: true
        - label: Tests added/updated and passing (Swift Testing, not XCTest)
        - label: Docs updated (if applicable)

  - type: checkboxes
    id: translation
    attributes:
      label: Translations (only if this PR adds or changes a translation)
      description: "See Translating Arcfin in CONTRIBUTING.md."
      options:
        - label: "The language is at least 90% translated (a fix to an existing translation can skip this)"
        - label: "Placeholders such as %@, %lld and ${applicationName} are kept"
        - label: "A second speaker of the language has read it through"
        - label: "Run in the language, with screenshots of the main screens attached"
